[package]
name = "codeg-mobile"
version = "0.1.0"
description = "Codeg 移动端封装 - 多服务切换 WebView"
authors = ["JiaweiWu"]
edition = "2021"

[lib]
name = "codeg_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
